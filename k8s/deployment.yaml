apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-app-deployment
  labels:
    app: biblioteca-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biblioteca-app
  template:
    metadata:
      labels:
        app: biblioteca-app
    spec:
      containers:
        - name: biblioteca-app
          image: biblioteca-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: biblioteca-jwt
                  key: JWT_SECRET
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"